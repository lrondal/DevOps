name: CI devops 2026
on:
  #to begin you want to launch this job in main and develop
  push:
    branches:
      - main
      - develop 
  pull_request:


jobs:
  test-backend: 
    runs-on: ubuntu-24.04
    steps:
     #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

     #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build and test with Maven
        run: mvn -B clean verify --file ./tp1-fullstack-app/backend/simpleapi/pom.xml

  sonar-analysis:
    needs: test-backend
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04

    steps:
     #checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

     #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: SonarCloud Scan
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=lrondal_DevOps -Dsonar.organization=lrondal -Dsonar.host.url=https://sonarcloud.io -Dsonar.login=${{ secrets.SONAR_TOKEN }} --file ./tp1-fullstack-app/backend/simpleapi/pom.xml


  # define job to build and publish docker image
  build-and-push-docker-image-database:
    needs: sonar-analysis
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database
          tags: |
            # Tag latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag short SHA
            type=sha,format=short

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./tp1-fullstack-app/database
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.ref == 'refs/heads/main' }}


  build-and-push-docker-image-backend:
    needs: sonar-analysis
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api
          tags: |
            # Tag latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag short SHA
            type=sha,format=short
            
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./tp1-fullstack-app/backend/simpleapi
          # Note: tags has to be all lower-case
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.ref == 'refs/heads/main' }}


  build-and-push-docker-image-httpd:
    needs: sonar-analysis
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd
          tags: |
            # Tag latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag short SHA
            type=sha,format=short

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./tp1-fullstack-app/httpd
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ github.ref == 'refs/heads/main' }}



