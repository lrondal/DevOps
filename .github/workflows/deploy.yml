name: Deploy Infrastructure

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False" 
        run: |
          ansible-playbook -i ${{ secrets.REMOTE_HOST }}, ansible/playbook.yml -u ${{ secrets.REMOTE_USER }} --private-key ~/.ssh/id_rsa --extra-vars "db_user=usr db_password=${{ secrets.DB_PASSWORD }}"
